<div class="enter-username mt-4 d-flex flex-column gap-2 justify-content-center align-items-center">
    <div class="d-flex flex-column gap-2">
        <input type="text" #redName placeholder="Red player username">
        <input type="text" #blueName placeholder="Blue player username">
    </div>

    <button
        class="btn btn-primary"
        (click)="startNewGame(redName.value, blueName.value)"
    >
        LET THE GAME BEGIN
    </button>
</div>
