AWSTemplateFormatVersion: 2010-09-09
Description: Core pipeline for Kassle (deploys core.yml, then seeds the games table)

# deploy this once per customer by hand, after that the pipeline runs on every push
# creates: pipeline-{cust}-{app}-{stage}-{env}, e.g. pipeline-doyle-kassle-core-dev

Parameters:

  # ---------------------------- Naming ----------------------------
  # customer name, lowercase since it ends up in bucket names
  Cust:
    Type: String
    AllowedPattern: '^[a-z0-9-]+$'
    Default: test1

  App:
    Type: String
    Default: kassle

  Stage:
    Type: String
    Default: core

  Env:
    Type: String
    Default: dev

  # ---------------------------- Source ----------------------------
  # github repo, edit for each customer
  RepoName:
    Type: String
    Default: hullis11/kassle-doyle

  BranchName:
    Type: String
    Default: main

  # id at the end of the github connection's arn (Developer Tools > Settings > Connections)
  # shared by every customer, made once by hand
  CodeStarConnectionID:
    Type: String
    Default: 646d1507-a189-439b-90d3-52460574f90b

  # ---------------------------- Pipeline ----------------------------
  # existing bucket where pipelines pass files between stages, shared by every customer
  # full name is codepipeline-{region}-{this id}
  PipelineBucketID:
    Type: String
    Default: 6c670866de5c-45aa-9a79-6d0238639fb3

  # true = run the pipeline on every push to BranchName
  AutoDeploy:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

Resources:

# ---------------------------- Pipeline Section ----------------------------
  # the pipeline itself: Source -> Deploy (core.yml) -> Seed (buildspec-core.yml)
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub 'pipeline-${Cust}-${App}-${Stage}-${Env}'
      PipelineType: V2
      RoleArn: !GetAtt PipelineRole.Arn
      # where each stage drops its output for the next stage to pick up
      ArtifactStore:
        Type: S3
        Location: !Sub 'codepipeline-${AWS::Region}-${PipelineBucketID}'
      Stages:

        # 1. grab the repo from github, zip it up as SourceOutput
        - Name: Source
          Actions:
            - Name: GitHub
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Sub 'arn:aws:codeconnections:${AWS::Region}:${AWS::AccountId}:connection/${CodeStarConnectionID}'
                FullRepositoryId: !Ref RepoName
                BranchName: !Ref BranchName
                OutputArtifactFormat: CODE_ZIP
                DetectChanges: !Ref AutoDeploy
              OutputArtifacts:
                - Name: SourceOutput

        # 2. deploy core.yml as its own stack, e.g. doyle-kassle-dev-core
        - Name: Deploy
          Actions:
            - Name: CoreStack
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              InputArtifacts:
                - Name: SourceOutput
              Configuration:
                # create the stack the first time, update it after that
                ActionMode: CREATE_UPDATE
                StackName: !Sub '${Cust}-${App}-${Env}-${Stage}'
                TemplatePath: 'SourceOutput::deploy/core/core.yml'
                # role cloudformation uses to make the tables/bucket/secret
                RoleArn: !GetAtt PipelineRole.Arn
                # hands this pipeline's names down to core.yml
                ParameterOverrides: !Sub '{"Cust":"${Cust}","App":"${App}","Stage":"${Stage}","Env":"${Env}"}'

        # 3. run buildspec-core.yml in codebuild to seed the games table
        - Name: Seed
          Actions:
            - Name: SeedGames
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutput
              Configuration:
                ProjectName: !Ref SeedDataProject
                # seed.js builds the table name from these
                EnvironmentVariables: !Sub '[{"name":"CUST_NAME","value":"${Cust}"},{"name":"APP_NAME","value":"${App}"},{"name":"ENV_NAME","value":"${Env}"}]'

# ---------------------------- CodeBuild Section ----------------------------
  # the machine that runs buildspec-core.yml (npm ci + node seed.js)
  SeedDataProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${Cust}-${App}-${Env}-seeddata'
      Description: Seeds the games table after core.yml deploys
      ServiceRole: !GetAtt PipelineRole.Arn
      # input and output both come from / go back to the pipeline
      Source:
        Type: CODEPIPELINE
        BuildSpec: deploy/core/buildspec-core.yml
      Artifacts:
        Type: CODEPIPELINE
      # smallest linux build box, same image the frontend uses
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0

# ---------------------------- IAM Section ----------------------------
  # one role shared by the pipeline, cloudformation and codebuild
  # every permission is limited to this customer's names (e.g. doyle-kassle-dev-*)
  # so this pipeline can't touch another customer's stuff in the same account
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Cust}-${App}-${Env}-${Stage}-role'
      # which aws services are allowed to use this role
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codepipeline.amazonaws.com
                - cloudformation.amazonaws.com
                - codebuild.amazonaws.com
            Action: sts:AssumeRole
      # what the role is allowed to do
      Policies:
        - PolicyName: !Sub '${Cust}-${App}-${Env}-${Stage}-policy'
          PolicyDocument:
            Statement:

              # read/write the shared artifact bucket (how stages pass the repo zip along)
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketLocation
                  - s3:GetBucketVersioning
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::codepipeline-${AWS::Region}-${PipelineBucketID}'
                  - !Sub 'arn:aws:s3:::codepipeline-${AWS::Region}-${PipelineBucketID}/*'

              # use the github connection (both names listed, aws renamed the service)
              - Effect: Allow
                Action:
                  - codeconnections:UseConnection
                  - codestar-connections:UseConnection
                Resource:
                  - !Sub 'arn:aws:codeconnections:${AWS::Region}:${AWS::AccountId}:connection/${CodeStarConnectionID}'
                  - !Sub 'arn:aws:codestar-connections:${AWS::Region}:${AWS::AccountId}:connection/${CodeStarConnectionID}'

              # create/update only this customer's core stack
              - Effect: Allow
                Action: cloudformation:*
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Cust}-${App}-${Env}-${Stage}/*'

              # the pipeline hands this same role to cloudformation and codebuild
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${Cust}-${App}-${Env}-${Stage}-role'

              # start the seeddata build and check on it
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !Sub 'arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/${Cust}-${App}-${Env}-seeddata'

              # codebuild writes its build logs here (what you read in the console)
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${Cust}-${App}-${Env}-seeddata*'

              # core.yml's tables (cloudformation creates them, seed.js writes games)
              - Effect: Allow
                Action: dynamodb:*
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Cust}-${App}-${Env}-*'

              # core.yml's screenshot bucket
              - Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub 'arn:aws:s3:::${Cust}-${App}-${Env}-*'
                  - !Sub 'arn:aws:s3:::${Cust}-${App}-${Env}-*/*'

              # core.yml's secret, e.g. doyle/kassle/dev
              - Effect: Allow
                Action: secretsmanager:*
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Cust}/${App}/${Env}*'
