AWSTemplateFormatVersion: 2010-09-09
Description: Static Site Resources for Frontend in S3

Parameters:

  # same naming as the other layers, the pipeline passes these in
  # every name below is built from them, e.g. test1-kassle-dev-site
  Cust:
    Type: String
    AllowedPattern: '^[a-z0-9-]+$'
    Default: test1

  App:
    Type: String
    Default: kassle

  Stage:
    Type: String
    Default: frontend

  Env:
    Type: String
    Default: dev

  # not used yet, CloudFront is on its default certificate until ours is issued
  SslCertArn:
    Type: String
    Default: arn:aws:acm:us-east-1:000000000000:certificate/00000000-0000-0000-0000-000000000000

  # HostedZoneID:
  #   Type: String
  #   Default: Z0156896FMTDL701TLX7

Resources:

  # ---------------------------- S3 Section ----------------------------
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      # holds the built angular files, e.g. test1-kassle-dev-site
      BucketName: !Sub '${Cust}-${App}-${Env}-site'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      WebsiteConfiguration:
        ErrorDocument: error.html
        IndexDocument: index.html

  BucketPolicy:
    DependsOn:
      - Bucket
      - CloudFrontDistro
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument: 
        Fn::Sub: 
          - |
            {
                "Version": "2008-10-17",
                "Id": "PolicyForCloudFrontPrivateContent",
                "Statement": [
                    {
                        "Sid": "AllowCloudFrontServicePrincipal",
                        "Effect": "Allow",
                        "Principal": {
                            "Service": "cloudfront.amazonaws.com"
                        },
                        "Action": "s3:GetObject",
                        "Resource": "arn:aws:s3:::${BucketName}/*",
                        "Condition": {
                            "StringEquals": {
                                "aws:SourceArn": "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistroId}"
                            }
                        }
                    }
                ]
            }
          - BucketName: !Ref Bucket
            CloudFrontDistroId: !GetAtt CloudFrontDistro.Id
        
       
          # ---------------------------- ACM Certificate Section ----------------------------
  # SSLCert:
  #   Type: AWS::CertificateManager::Certificate
  #   Properties:
  #     CertificateTransparencyLoggingPreference: ENABLED
  #     DomainName: !Join
  #       - ''
  #       - - !Ref SiteName
  #         - .com
  #     # DomainValidationOptions:
  #     #   - DomainName: !Join
  #     #       - ''
  #     #       - - !Ref SiteName
  #     #         - .com
  #     #     HostedZoneId: !Ref HostedZoneID
