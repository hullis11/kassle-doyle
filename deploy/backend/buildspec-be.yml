version: 0.2

# runs in the Deploy stage of pipeline-{cust}-{app}-backend-{env}, after core and auth are deployed
# the pipeline passes in CUST_NAME, APP_NAME, ENV_NAME, REGION and ENABLE_AUTHORIZER
# serverless.yml reads those to name everything, e.g. stack test1-kassle-dev-backend

env:
  # serverless framework v4 needs a login key to deploy, pulled from secrets manager
  # (secret "serverless-access", key "serverless_access")
  secrets-manager:
    SERVERLESS_ACCESS_KEY: serverless-access:serverless_access

phases:

  # pick the node version for the build box
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Node version on this build box:"
      - node --version

  # install serverless and the backend packages from backend/package-lock.json
  pre_build:
    commands:
      - echo "Deploying backend for $CUST_NAME / $APP_NAME / $ENV_NAME in $REGION"
      - echo "Authorizer enabled = $ENABLE_AUTHORIZER (false on the first deploy, true after)"
      - cd backend
      - echo "Installing backend packages with npm ci"
      - npm ci
      - echo "Serverless version:"
      - npx serverless --version

  # serverless turns serverless.yml into cloudformation and deploys it
  # (api gateway, the 7 lambdas, the lambda role)
  build:
    commands:
      - echo "Running serverless deploy"
      - npx serverless deploy

  # print the api url so it can be copied into the secret as BACKEND_URL
  post_build:
    commands:
      - echo "Backend info (copy the endpoint base url into the secret as BACKEND_URL):"
      - npx serverless info
