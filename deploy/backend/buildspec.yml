version: 0.2

env:
  # change these for each customer repo
  variables:
    CUST_NAME: changeme
    APP_NAME: kassle
    ENV_NAME: dev
  secrets-manager:
    SERVERLESS_ACCESS_KEY: serverless-access:serverless_access



phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - echo "node version"
      - node --version
  pre_build:
    commands:
      - cd backend
      - echo "installing backend packages"
      - npm ci
      - npx serverless --version
  build:
    commands:
      - echo "deploying backend for $CUST_NAME $ENV_NAME"
      - npx serverless deploy
      - echo "seeding starter games"
      - node seed.js
      - echo "deploy finished"

cache:
  paths:
    - /root/.npm/**/*
